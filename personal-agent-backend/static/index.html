<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SparkBot</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      color-scheme: dark;
      --bg: #101713;
      --panel: #19231f;
      --line: rgba(215, 235, 225, 0.12);
      --text: #edf7f2;
      --muted: #8fa299;
      --accent: #77d7b2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 22% 8%, rgba(119, 215, 178, .12), transparent 32%),
        linear-gradient(135deg, #0f1713, #17211d);
    }
    main {
      width: min(520px, calc(100vw - 32px));
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(25, 35, 31, .82);
      box-shadow: 0 22px 70px rgba(0, 0, 0, .28);
    }
    h1 { margin: 0 0 8px; font-size: 1.35rem; }
    p { margin: 0 0 20px; color: var(--muted); line-height: 1.6; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 16px;
      border-radius: 999px;
      color: #082018;
      background: var(--accent);
      text-decoration: none;
      font-weight: 800;
    }
    a.secondary {
      color: var(--text);
      background: rgba(255,255,255,.06);
      border: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <main>
    <h1>SparkBot</h1>
    <p>旧测试入口已收口，请使用新版后台管理或对话测试页面。</p>
    <div class="actions">
      <a href="/admin">后台管理</a>
      <a class="secondary" href="/chat">对话测试</a>
    </div>
  </main>
</body>
</html>
