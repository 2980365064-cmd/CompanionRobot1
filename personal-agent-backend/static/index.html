<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SparkBot Agent 管理台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #242836;
      --border: #2e3348;
      --text: #e8eaef;
      --muted: #8b92a8;
      --accent: #6c9eff;
      --accent-dim: #4a7ad4;
      --user-bg: #2a3550;
      --bot-bg: #1e2433;
      --ok: #5dd39e;
      --err: #ff7b7b;
      --warn: #f0c060;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
    }
    aside {
      width: 320px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex-shrink: 0;
      overflow-y: auto;
      max-height: 100vh;
    }
    aside h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    aside .sub {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: -8px;
    }
    .section-title {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 4px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }
    label {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    input, select, textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 9px 11px;
      font-family: inherit;
      font-size: 0.85rem;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .row { display: flex; gap: 8px; }
    .row button { flex: 1; }
    button {
      background: var(--accent);
      color: #0a0e17;
      border: none;
      border-radius: 8px;
      padding: 9px 13px;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      white-space: nowrap;
    }
    button:hover { background: #8bb4ff; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    button.secondary:hover { background: var(--border); }
    button.danger {
      background: transparent;
      color: var(--err);
      border: 1px solid var(--err);
    }
    button.danger:hover { background: rgba(255,123,123,0.1); }
    button.small {
      padding: 5px 10px;
      font-size: 0.72rem;
      border-radius: 6px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      padding: 9px 11px;
      background: var(--surface2);
      border-radius: 8px;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    .dot.err { background: var(--err); }
    .dot.warn { background: var(--warn); }
    .session-id {
      font-size: 0.68rem;
      color: var(--muted);
      word-break: break-all;
      line-height: 1.4;
    }

    /* Admin section */
    .admin-section {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .admin-locked {
      text-align: center;
      color: var(--muted);
      font-size: 0.78rem;
    }
    .person-card {
      background: var(--surface2);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .person-card .name {
      font-weight: 600;
      font-size: 0.88rem;
    }
    .person-card .pid {
      font-size: 0.68rem;
      color: var(--muted);
      font-family: monospace;
    }
    .person-card .actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .person-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 360px;
      overflow-y: auto;
    }
    .empty-hint {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
      padding: 12px;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .msg {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: var(--radius);
      line-height: 1.55;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user-bg);
      border-bottom-right-radius: 4px;
    }
    .msg.bot {
      align-self: flex-start;
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .msg.system {
      align-self: center;
      background: transparent;
      color: var(--muted);
      font-size: 0.8rem;
      padding: 4px 12px;
    }
    .msg .meta {
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 6px;
    }
    .composer {
      padding: 16px 24px 24px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .composer-inner {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      max-width: 900px;
      margin: 0 auto;
    }
    #input {
      flex: 1;
      min-height: 48px;
      max-height: 160px;
      resize: vertical;
    }
    #sendBtn {
      height: 48px;
      padding: 0 24px;
      flex-shrink: 0;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      width: 520px;
      max-width: 90vw;
      max-height: 80vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .modal h3 {
      font-size: 1rem;
      font-weight: 600;
    }
    .modal .close-row {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .l0-item {
      background: var(--surface2);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .l0-item .l0-cat {
      font-size: 0.68rem;
      color: var(--accent);
      text-transform: uppercase;
    }
    .l0-item .l0-content {
      font-size: 0.85rem;
    }
    .l0-item .l0-meta {
      font-size: 0.65rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .l0-edit-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .l0-edit-row input { flex: 1; font-size: 0.8rem; padding: 6px 8px; }
    .l0-edit-row select { width: auto; font-size: 0.75rem; padding: 6px 8px; }

    .confirm-text {
      font-size: 0.88rem;
      color: var(--err);
      font-weight: 500;
      text-align: center;
      padding: 8px;
    }
    @media (max-width: 768px) {
      body { flex-direction: column; }
      aside { width: 100%; max-height: none; border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <aside>
    <div>
      <h1>SparkBot 管理台</h1>
      <p class="sub">WebSocket · 身份管理 · 记忆编辑</p>
    </div>

    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">未连接</span>
    </div>
    <div class="status" style="margin-top:-8px">
      <span class="dot" id="llmDot"></span>
      <span id="llmText">LLM 检测中…</span>
    </div>
    <div class="status" style="margin-top:-8px">
      <span class="dot" id="embedDot"></span>
      <span id="embedText">Embedding 检测中…</span>
    </div>

    <div class="row">
      <button type="button" class="secondary" id="newSessionBtn">新会话</button>
    </div>
    <p class="session-id" id="sessionLabel">session: —</p>

    <!-- 身份管理 -->
    <div class="section-title">身份管理</div>
    <div class="admin-section" id="adminPanel">
      <div class="admin-locked" id="adminLocked">
        <p style="margin-bottom:8px">输入 Admin 密码解锁</p>
        <div class="row">
          <input id="adminPassword" type="password" placeholder="Admin 密码" style="flex:1" />
          <button id="adminUnlockBtn" class="small">解锁</button>
        </div>
      </div>
      <div id="adminUnlocked" style="display:none; flex-direction:column; gap:10px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:0.78rem; font-weight:600;">已实名用户</span>
          <button class="small secondary" id="refreshPersonsBtn">刷新</button>
        </div>
        <div class="person-list" id="personList">
          <div class="empty-hint">加载中…</div>
        </div>
        <!-- 新建用户 -->
        <div style="border-top:1px solid var(--border); padding-top:8px;">
          <label>新建用户</label>
          <div style="display:flex; gap:6px; margin-bottom:4px;">
            <input id="newPersonId" placeholder="person_id（如 ypx）" style="flex:1; font-size:0.78rem;" />
            <input id="newPersonName" placeholder="显示名（如 叶鹏祥）" style="flex:1; font-size:0.78rem;" />
          </div>
          <button class="small" id="createPersonBtn" style="width:100%">创建用户</button>
        </div>
        <button class="small secondary" id="clearChatBtn" style="flex:1">清空对话</button>
      </div>
    </div>
  </aside>

  <main>
    <div id="messages">
      <div class="msg system">自动连接中…</div>
    </div>
    <div class="composer">
      <div class="composer-inner">
        <textarea id="input" rows="1" placeholder="输入消息，Enter 发送…" disabled></textarea>
        <button type="button" id="sendBtn" disabled>发送</button>
      </div>
    </div>
  </main>

  <!-- L0 编辑器弹窗 -->
  <div class="modal-overlay" id="l0Modal">
    <div class="modal">
      <h3>L0 核心记忆 · <span id="l0PersonName"></span></h3>
      <div id="l0List"></div>
      <div style="border-top:1px solid var(--border); padding-top:10px;">
        <label>新增 L0 条目</label>
        <div class="l0-edit-row">
          <select id="l0NewCat">
            <option value="identity">身份与关系</option>
            <option value="taboo">禁忌与雷区</option>
            <option value="key_people">核心亲人</option>
            <option value="milestone">人生节点</option>
            <option value="preference">偏好与习惯</option>
          </select>
          <input id="l0NewContent" placeholder="内容…" />
          <button class="small" id="l0CreateBtn">添加</button>
        </div>
      </div>
      <div class="close-row">
        <button class="secondary small" id="l0CloseBtn">关闭</button>
      </div>
    </div>
  </div>

  <!-- 确认弹窗 -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal">
      <h3 id="confirmTitle">确认操作</h3>
      <p class="confirm-text" id="confirmText"></p>
      <div class="close-row">
        <button class="secondary small" id="confirmCancelBtn">取消</button>
        <button class="danger small" id="confirmOkBtn">确认</button>
      </div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    const API_TOKEN = "dev-token";
    const DEVICE_ID = "web-admin";
    const BASE_URL = (() => { const { protocol, host } = window.location; return `${protocol}//${host}`; })();

    const state = {
      connected: false,
      sessionId: "",
      ws: null,
      sending: false,
      adminUnlocked: false,
      persons: [],
      l0PersonId: "",
    };

    function apiHeaders() {
      return { "Content-Type": "application/json", "X-API-Token": API_TOKEN };
    }

    function setLlmStatus(ok, text) {
      $("llmDot").className = "dot" + (ok ? " ok" : ok === false ? " err" : "");
      $("llmText").textContent = text;
    }

    function setEmbedStatus(ok, text) {
      $("embedDot").className = "dot" + (ok ? " ok" : ok === false ? " err" : "");
      $("embedText").textContent = text;
    }

    async function checkHealth() {
      try {
        const r = await fetch(`${BASE_URL}/health`);
        if (!r.ok) throw new Error("服务未启动");
        const data = await r.json();
        const llm = data.llm || {};
        setLlmStatus(!!llm.configured, llm.configured ? `DeepSeek · ${llm.model || "deepseek-chat"}` : "DeepSeek 未配置");
        const embed = data.embed || {};
        setEmbedStatus(!!embed.configured, embed.configured ? `${embed.provider || ""} · ${embed.model || ""}` : "Embedding 未配置（本地 fallback）");
        return data;
      } catch (e) {
        setLlmStatus(false, "无法访问服务");
        setEmbedStatus(false, "—");
        return null;
      }
    }

    function setStatus(ok, text) {
      $("statusDot").className = "dot" + (ok ? " ok" : ok === false ? " err" : "");
      $("statusText").textContent = text;
    }

    function addMessage(role, text, meta = "") {
      const el = document.createElement("div");
      el.className = "msg " + role;
      const body = document.createElement("div");
      body.textContent = text;
      el.appendChild(body);
      if (meta) {
        const m = document.createElement("div");
        m.className = "meta";
        m.textContent = meta;
        el.appendChild(m);
      }
      $("messages").appendChild(el);
      $("messages").scrollTop = $("messages").scrollHeight;
    }

    function addSystem(text) { addMessage("system", text); }

    function updateSessionLabel() {
      $("sessionLabel").textContent = state.sessionId ? `session: ${state.sessionId}` : "session: —";
    }

    function setComposerEnabled(on) {
      $("input").disabled = !on;
      $("sendBtn").disabled = !on || state.sending;
    }

    function loadSettings() {
      const saved = JSON.parse(localStorage.getItem("sparkbot-admin") || "{}");
      if (saved.adminUnlocked) {
        state.adminUnlocked = true;
        $("adminLocked").style.display = "none";
        $("adminUnlocked").style.display = "flex";
      }
    }

    function saveSettings() {
      localStorage.setItem("sparkbot-admin", JSON.stringify({
        adminUnlocked: state.adminUnlocked,
      }));
    }

    function connect() {
      setStatus(null, "连接中…");

      if (state.ws) {
        state.ws.close();
        state.ws = null;
      }

      const wsUrl = BASE_URL.replace(/^http/, "ws") + "/ws/v1/chat";
      const ws = new WebSocket(wsUrl);
      state.ws = ws;

      ws.onopen = () => {
        ws.send(JSON.stringify({
          type: "hello",
          device_id: DEVICE_ID,
          token: API_TOKEN,
          session_id: state.sessionId || "",
        }));
      };

      ws.onmessage = (ev) => {
        let data;
        try { data = JSON.parse(ev.data); } catch { return; }

        if (data.type === "hello_ack") {
          state.sessionId = data.session_id || "";
          updateSessionLabel();
          state.connected = true;
          setStatus(true, "WebSocket 已连接");
          setComposerEnabled(true);
          addSystem("WebSocket 握手成功。");
          checkHealth();
          if (state.adminUnlocked) refreshPersons();
        } else if (data.type === "reply") {
          state.sessionId = data.session_id || state.sessionId;
          updateSessionLabel();
          addMessage("bot", data.text || "");
          state.sending = false;
          setComposerEnabled(true);
        } else if (data.type === "follow_up") {
          addMessage("bot", "💬 " + (data.text || ""), "主动追问");
        } else if (data.type === "error") {
          addSystem("错误: " + (data.message || data.code));
          state.sending = false;
          setComposerEnabled(true);
        } else if (data.type === "pong") {
          /* heartbeat */
        } else if (data.type === "session_end_ack") {
          state.sessionId = data.session_id || "";
          updateSessionLabel();
          addSystem("会话已结束。");
        }
      };

      ws.onerror = () => {
        setStatus(false, "WebSocket 连接失败");
      };

      ws.onclose = () => {
        if (state.connected) {
          state.connected = false;
          setStatus(false, "连接已断开");
          setComposerEnabled(false);
          addSystem("WebSocket 连接已关闭。");
        }
      };
    }

    async function sendMessage() {
      const text = $("input").value.trim();
      if (!text || !state.connected || state.sending) return;
      if (!state.ws || state.ws.readyState !== WebSocket.OPEN) {
        addSystem("WebSocket 未连接");
        return;
      }

      addMessage("user", text);
      $("input").value = "";
      state.sending = true;
      setComposerEnabled(false);
      state.ws.send(JSON.stringify({ type: "chat", message: text }));
    }

    async function newSession() {
      if (!state.connected || !state.ws) return;
      state.ws.send(JSON.stringify({ type: "new_session" }));
      addSystem("已请求新会话…");
    }

    function clearChat() {
      $("messages").innerHTML = "";
      addSystem("对话已清空。");
    }

    // ── 身份管理 ──

    async function apiCall(method, path, body = null) {
      const opts = { method, headers: apiHeaders() };
      if (body) opts.body = JSON.stringify(body);
      const r = await fetch(`${BASE_URL}${path}`, opts);
      if (!r.ok) {
        let detail = await r.text();
        try { detail = JSON.parse(detail).detail || detail; } catch (_) {}
        throw new Error(detail || `HTTP ${r.status}`);
      }
      return r.json();
    }

    async function refreshPersons() {
      if (!state.adminUnlocked) return;
      try {
        const data = await apiCall("GET", "/v1/admin/persons");
        state.persons = data.persons || [];
        renderPersonList();
      } catch (e) {
        $("personList").innerHTML = `<div class="empty-hint">加载失败: ${e.message}</div>`;
      }
    }

    async function createPerson() {
      const pid = $("newPersonId").value.trim();
      const name = $("newPersonName").value.trim();
      if (!pid) return alert("请输入 person_id");
      if (!name) return alert("请输入显示名");
      try {
        await apiCall("POST", "/v1/admin/persons", { person_id: pid, display_name: name });
        $("newPersonId").value = "";
        $("newPersonName").value = "";
        await refreshPersons();
        addSystem(`已创建用户: ${name} (${pid})`);
      } catch (e) {
        alert("创建失败: " + e.message);
      }
    }

    function renderPersonList() {
      const list = state.persons;
      if (list.length === 0) {
        $("personList").innerHTML = '<div class="empty-hint">暂无已实名用户<br/><small>用户通过对话说「我叫XX ID xxx」完成实名</small></div>';
        return;
      }
      $("personList").innerHTML = list.map(p => `
        <div class="person-card">
          <div class="name">${escHtml(p.display_name || p.person_id)}</div>
          <div class="pid">${escHtml(p.person_id)}</div>
          <div class="actions">
            <button class="small" onclick="openL0Editor('${escHtml(p.person_id)}', '${escHtml(p.display_name || p.person_id)}')">编辑 L0</button>
            <button class="small secondary" onclick="openProfileEditor('${escHtml(p.person_id)}')">画像</button>
            <button class="small danger" onclick="confirmDeleteL2('${escHtml(p.person_id)}', '${escHtml(p.display_name || p.person_id)}')">删除 L2</button>
            <button class="small danger" onclick="confirmDeletePerson('${escHtml(p.person_id)}', '${escHtml(p.display_name || p.person_id)}')">删除用户</button>
          </div>
        </div>
      `).join("");
    }

    function escHtml(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    function unlockAdmin() {
      const pw = $("adminPassword").value;
      if (pw !== "520123") {
        alert("密码错误");
        return;
      }
      state.adminUnlocked = true;
      saveSettings();
      $("adminLocked").style.display = "none";
      $("adminUnlocked").style.display = "flex";
      refreshPersons();
    }

    // ── L0 编辑器 ──

    async function openL0Editor(personId, name) {
      state.l0PersonId = personId;
      $("l0PersonName").textContent = name;
      $("l0Modal").classList.add("active");
      await loadL0List();
    }

    function closeL0Editor() {
      $("l0Modal").classList.remove("active");
      state.l0PersonId = "";
    }

    async function loadL0List() {
      try {
        const data = await apiCall("GET", `/v1/admin/persons/${state.l0PersonId}/l0`);
        const items = data.items || [];
        if (items.length === 0) {
          $("l0List").innerHTML = '<div class="empty-hint">该用户暂无 L0 核心记忆</div>';
        } else {
          $("l0List").innerHTML = items.map(item => `
            <div class="l0-item">
              <div class="l0-cat">${escHtml(item.category_label || item.category)}</div>
              <div class="l0-content">${escHtml(item.content)}</div>
              <div class="l0-meta">
                <span>${escHtml(item.source || "")} · ${item.confidence || ""}</span>
                <button class="small danger" onclick="deleteL0Item(${item.id})">删除</button>
              </div>
            </div>
          `).join("");
        }
      } catch (e) {
        $("l0List").innerHTML = `<div class="empty-hint">加载失败: ${e.message}</div>`;
      }
    }

    async function createL0Item() {
      const cat = $("l0NewCat").value;
      const content = $("l0NewContent").value.trim();
      if (!content) return alert("请输入内容");
      try {
        await apiCall("POST", `/v1/admin/persons/${state.l0PersonId}/l0`, { category: cat, content });
        $("l0NewContent").value = "";
        await loadL0List();
      } catch (e) {
        alert("创建失败: " + e.message);
      }
    }

    async function deleteL0Item(l0Id) {
      if (!confirm("确认删除此 L0 条目？")) return;
      try {
        await apiCall("DELETE", `/v1/admin/persons/${state.l0PersonId}/l0/${l0Id}`);
        await loadL0List();
      } catch (e) {
        alert("删除失败: " + e.message);
      }
    }

    // ── 画像编辑器 ──

    async function openProfileEditor(personId) {
      try {
        const data = await apiCall("GET", `/v1/admin/persons/${personId}/profile`);
        const p = data;
        const name = prompt("显示名", p.display_name || "");
        if (name === null) return;
        const rel = prompt("关系（如：本人/朋友/家人）", p.relationship || "");
        if (rel === null) return;
        const personality = prompt("性格标签（逗号分隔）", (p.personality || []).join(", "));
        if (personality === null) return;
        const exps = prompt("重要经历（逗号分隔）", (p.experiences || []).join(", "));
        if (exps === null) return;
        const body = { display_name: name, relationship: rel };
        if (personality) body.personality = personality.split(",").map(s => s.trim()).filter(Boolean);
        if (exps) body.experiences = exps.split(",").map(s => s.trim()).filter(Boolean);
        await apiCall("PUT", `/v1/admin/persons/${personId}/profile`, body);
        await refreshPersons();
        alert("画像已更新");
      } catch (e) {
        alert("操作失败: " + e.message);
      }
    }

    // ── 确认弹窗 ──

    let confirmCallback = null;

    function showConfirm(title, text, cb) {
      $("confirmTitle").textContent = title;
      $("confirmText").textContent = text;
      confirmCallback = cb;
      $("confirmModal").classList.add("active");
    }

    function hideConfirm() {
      $("confirmModal").classList.remove("active");
      confirmCallback = null;
    }

    function confirmDeleteL2(personId, name) {
      showConfirm(
        "删除 L2 情景记忆",
        `确定删除「${name}」的全部 L2 情景记忆吗？此操作不可逆。\n\n（不会删除 L0 核心记忆和人物画像）`,
        async () => {
          try {
            const data = await apiCall("DELETE", `/v1/admin/persons/${personId}/l2`);
            addSystem(`已删除 ${name} 的 L2 情景记忆 · ${data.l2_count || 0} 条`);
            hideConfirm();
          } catch (e) {
            alert("删除失败: " + e.message);
            hideConfirm();
          }
        }
      );
    }

    function confirmDeletePerson(personId, name) {
      showConfirm(
        "删除用户",
        `确定删除「${name}」（${personId}）及其全部数据？\n\n将同时删除：人物画像、L0 核心记忆、L2 情景记忆、L3 长期记忆、Facts 等。此操作不可逆！`,
        async () => {
          try {
            const data = await apiCall("DELETE", `/v1/admin/persons/${personId}`);
            addSystem(`已删除用户 ${data.display_name} · 共计 ${Object.values(data.delete_stats || {}).join("+")} 条记录`);
            await refreshPersons();
            hideConfirm();
          } catch (e) {
            alert("删除失败: " + e.message);
            hideConfirm();
          }
        }
      );
    }

    // ── 事件绑定 ──

    $("newSessionBtn").addEventListener("click", newSession);
    $("clearChatBtn").addEventListener("click", clearChat);
    $("sendBtn").addEventListener("click", sendMessage);
    $("input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    $("adminUnlockBtn").addEventListener("click", unlockAdmin);
    $("adminPassword").addEventListener("keydown", (e) => {
      if (e.key === "Enter") unlockAdmin();
    });
    $("refreshPersonsBtn").addEventListener("click", refreshPersons);
    $("createPersonBtn").addEventListener("click", createPerson);
    $("l0CloseBtn").addEventListener("click", closeL0Editor);
    $("l0CreateBtn").addEventListener("click", createL0Item);
    $("confirmCancelBtn").addEventListener("click", hideConfirm);
    $("confirmOkBtn").addEventListener("click", () => { if (confirmCallback) confirmCallback(); });
    $("l0NewContent").addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); createL0Item(); }
    });

    // 点击遮罩关闭弹窗
    $("l0Modal").addEventListener("click", (e) => { if (e.target === $("l0Modal")) closeL0Editor(); });
    $("confirmModal").addEventListener("click", (e) => { if (e.target === $("confirmModal")) hideConfirm(); });

    // ── 启动：自动连接 ──
    loadSettings();
    updateSessionLabel();
    checkHealth();
    connect();
  </script>
</body>
</html>
